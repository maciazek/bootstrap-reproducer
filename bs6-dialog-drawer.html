<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Bootstrap 6 Dialog-Drawer</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
        <style>
            .dialog {
                /* Slow down for better visibility */
                --bs-dialog-transition-duration: .75s;
            }

            .drawer {
                /* Slow down for better visibility */
                --bs-drawer-transition-duration: .75s;

                /* Make Drawer look like Bootstrap 5' Offcanvas */
                --bs-drawer-inset: 0rem;
                --bs-drawer-border-width: 0;
                --bs-drawer-border-radius: var(--bs-radius-0);
                --bs-drawer-backdrop-bg: color-mix(in oklch, var(--bs-bg-body) 25%, #000000a6);
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="row">
                <div class="col-12">
                    <h2 class="text-center">Bootstrap 6 Dialog-Drawer</h2>
                    <hr>
                    <div class="text-center">
                        <button type="button" class="btn-solid theme-primary" data-bs-toggle="dialog" data-bs-target="#dialog">
                            Open Dialog
                        </button>
                        <button class="btn-solid theme-primary" type="button" data-bs-toggle="drawer" data-bs-target="#drawer" aria-controls="drawer">
                            Open Drawer
                        </button>
                    </div>

                    <dialog class="dialog dialog-slide-down" id="dialog">
                        <div class="dialog-header">
                            <h1 class="dialog-title">Dialog</h1>
                            <button type="button" class="btn-close" data-bs-dismiss="dialog" aria-label="Close"></button>
                        </div>
                        <div class="dialog-body">
                            <p>When you close this dialog, backdrop will fade out with transition.</p>
                        </div>
                        <div class="dialog-footer">
                            <button type="button" class="btn-solid theme-secondary" data-bs-dismiss="dialog">Close</button>
                        </div>
                    </dialog>

                    <dialog class="drawer drawer-start" tabindex="-1" id="drawer" aria-labelledby="drawerLabel">
                        <div class="drawer-header">
                            <h5 class="drawer-title" id="drawerLabel">Drawer</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
                        </div>
                        <div class="drawer-body">
                            <div>
                                When you close this drawer, backdrop will be dropped immediately without transition.
                            </div>
                        </div>
                    </dialog>
                </div>
            </div>
        </div>

        <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
    </body>
</html>
